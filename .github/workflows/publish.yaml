name: Publish

on:
  workflow_dispatch:

env:
  SITE_DIR: "_site"

jobs:
  setup:
    runs-on: ubuntu-latest

    outputs:
      lua: ${{ steps.version.outputs.lua }}
      packages: ${{ steps.version.outputs.packages }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: version
        run: |
          echo "lua=$(cat .lua-version)" >> "$GITHUB_OUTPUT"
          echo "packages=$(jq -c . rocks.json)" >> "$GITHUB_OUTPUT"

  download-rock:
    name: download-rock ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    needs: setup

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.setup.outputs.packages).download }}

    env:
      LUA_VERSION: ${{ needs.setup.outputs.lua }}

    steps:
      - name: Download release assets
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1
        with:
          repository: ${{ matrix.package.repo }}
          tag: ${{ matrix.package.tag }}
          fileName: "${{ matrix.package.name }}*.rock"
          tarBall: false
          zipBall: false

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: "error"
          name: ${{ matrix.package.name }}
          path: |
            *.rock

  build-rock:
    name: build-rock ${{ matrix.package.name }} (${{ matrix.job.target }})
    runs-on: ${{ matrix.job.os }}
    needs: setup

    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
        package: ${{ fromJson(needs.setup.outputs.packages).build }}

    env:
      LUA_VERSION: ${{ needs.setup.outputs.lua }}

    steps:
      - name: Setup Lux
        uses: lumen-oss/gh-actions-lux@d12a6bdf3a380de5b9d142272e6fd95d28b44b8d # v1
        with:
          version: ${{ vars.LUX_VERSION }}

      - name: Pack rock (windows)
        if: ${{ endsWith(matrix.job.target, '-msvc') }}
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          lx --lua-version ${{ env.LUA_VERSION }} pack ${{ matrix.package.name }}@${{ matrix.package.tag }}

      - name: Pack rock (unix)
        if: ${{ !endsWith(matrix.job.target, '-msvc') }}
        run: |
          lx --lua-version ${{ env.LUA_VERSION }} pack ${{ matrix.package.name }}@${{ matrix.package.tag }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: "error"
          name: ${{ matrix.package.name }}-${{ matrix.job.target }}
          path: |
            *.rock

  upload:
    needs: [setup, download-rock, build-rock]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      LUA_VERSION: ${{ needs.setup.outputs.lua }}

    steps:
      - uses: luarocks/gh-actions-lua@56eba09993704b908cc3c7c2753e630d18cb9696 # v14
        with:
          luaVersion: ${{ env.LUA_VERSION }}

      - uses: luarocks/gh-actions-luarocks@95d2308a0aff36ad31ebadca493ed14853399842 # v7

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          merge-multiple: true

      - name: Regenerate Manifests and HTML
        run: luarocks-admin make-manifest --lua-version=${{ env.LUA_VERSION }} .

      - name: Prep site
        run: |
          mkdir -p ${{ env.SITE_DIR }}
          mv *.rock manifest* index.html ${{ env.SITE_DIR }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    needs: upload
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
